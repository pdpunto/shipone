name: Beta Release

on:
  push:
    tags:
      - "v*-beta*"
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Beta tag to release"
        required: true
        default: "v0.0.4-beta.1"

permissions:
  contents: write

jobs:
  beta-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Resolve beta tag
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "RELEASE_TAG=${{ inputs.tag_name }}" >> "$GITHUB_ENV"
          else
            echo "RELEASE_TAG=${{ github.ref_name }}" >> "$GITHUB_ENV"
          fi

      - name: Validate beta tag
        run: node scripts/semver.mjs validate-beta-tag "$RELEASE_TAG"

      - name: Install
        run: npm ci

      - name: Compile
        run: npm run compile

      - name: Package extension
        run: npx @vscode/vsce package

      - name: Create beta GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          prerelease: true
          generate_release_notes: true
          files: "*.vsix"
