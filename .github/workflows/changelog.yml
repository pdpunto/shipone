name: Changelog

on:
  release:
    types:
      - published
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Release tag"
        required: true
        default: "v0.0.4"
      release_body:
        description: "Release notes"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  update-changelog:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Update changelog
        env:
          CHANGELOG_TAG: ${{ github.event_name == 'release' && github.event.release.tag_name || inputs.tag_name }}
          CHANGELOG_BODY: ${{ github.event_name == 'release' && github.event.release.body || inputs.release_body }}
        run: node scripts/update-changelog.mjs

      - name: Commit changelog
        run: |
          git add CHANGELOG.md
          if git diff --cached --quiet; then
            echo "No changelog changes."
            exit 0
          fi
          git commit -m "docs: update changelog"
          git push
